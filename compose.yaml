name: steve-barber-shop
services:
  backend:
    build: ../backend
    restart: unless-stopped
    env_file: ../backend/.env
    volumes:
      - barber_data:/app/data
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3000/api/health',timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
  frontend:
    build: .
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    expose:
      - "8080"
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - frontend
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
volumes:
  barber_data:
  caddy_data:
  caddy_config:
